<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECMWF AIFS Weather Forecast</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Inter, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.header-info {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.header-info h1 {
    margin: 0 0 10px;
    color: #f1f5f9;
    font-size: 32px;
}

.info-line {
    color: #cbd5e1;
    font-size: 18px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
}

#errorMessage {
    color: #ef4444;
    background: #2e1f1f;
    border: 1px solid #7f1d1d;
}

#warningMessage {
    color: #f59e0b;
    background: #2e2410;
    border: 1px solid #78350f;
}

#successMessage {
    color: #10b981;
    background: #1a2e26;
    border: 1px solid #064e3b;
}

.form-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.form-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: flex-end;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-label {
    color: #cbd5e1;
    font-size: 14px;
}

.form-input,
.form-select {
    height: 42px;
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 10px 16px;
    font-family: Inter, sans-serif;
}

.form-input {
    width: 120px;
}

.form-select {
    min-width: 200px;
}

.submit-btn {
    height: 42px;
    padding: 10px 24px;
    border: 0;
    border-radius: 9px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:disabled {
    background: #475569;
    cursor: wait;
}

.chart-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    position: relative;
}

.chart-wrapper {
    position: relative;
    height: 450px;
}

.chart-loading {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(30, 41, 59, 0.8);
    z-index: 10;
}

.chart-loading.active {
    display: flex;
}

.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(59,130,246,.15);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.status-text {
    text-align: center;
    margin-top: 12px;
    color: #94a3b8;
    font-size: 13px;
}

.debug {
    margin-top: 15px;
    padding: 12px;
    background: #020617;
    border-radius: 8px;
    color: #94a3b8;
    font: 12px monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 250px;
    overflow: auto;
}
</style>
</head>

<body>

<div class="container">

    <div class="header-info">
        <h1>ECMWF AIFS Weather Forecast</h1>
        <div class="info-line">
            Model Run - 0Z, 6Z, 12Z, 18Z
        </div>
    </div>

    <div id="errorMessage" class="message" role="alert"></div>
    <div id="warningMessage" class="message" role="alert"></div>
    <div id="successMessage" class="message" role="status"></div>

    <div class="form-container">

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label" for="latInput">Latitude</label>
                <input
                    id="latInput"
                    class="form-input"
                    type="number"
                    value="42.5"
                    step="0.1"
                    min="-90"
                    max="90"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="lonInput">Longitude</label>
                <input
                    id="lonInput"
                    class="form-input"
                    type="number"
                    value="42"
                    step="0.1"
                    min="-180"
                    max="180"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="variableSelect">Weather Variable</label>

                <select id="variableSelect" class="form-select">

                    <option value="7">
                        T2m
                    </option>

                    <option value="0">
                        T850
                    </option>

                    <option value="4">
                        Z500
                    </option>

                    <option value="2">
                        MSLP
                    </option>

                    <option value="13">
                        Precipitation
                    </option>

                </select>
            </div>

            <div class="form-group">

                <button
                    id="fetchBtn"
                    type="button"
                    class="submit-btn"
                    onclick="fetchData()"
                >
                    Update
                </button>

            </div>

        </div>

    </div>

    <div class="chart-container">

        <div
            id="chartLoading"
            class="chart-loading"
        >
            <div class="spinner"></div>
        </div>

        <div class="chart-wrapper">
            <canvas id="forecastChart"></canvas>
        </div>

        <div
            id="statusText"
            class="status-text"
        >
            Ready
        </div>

        <div
            id="debugBox"
            class="debug"
        ></div>

    </div>

</div>

<script>

let chart = null;


/* =========================================================
   CONFIG
========================================================= */

const RUNS = [0, 6, 12, 18];

const COLORS = {

    0: '#53a0e5',

    6: '#ffea00',

    12: '#1cc412',

    18: '#ff0000'

};

const VARIABLE_CONFIG = {

    0: {
        name: 'T850',
        unit: '°C',
        roundStep: 5
    },

    2: {
        name: 'MSLP',
        unit: 'hPa',
        roundStep: 10
    },

    4: {
        name: 'Z500',
        unit: 'dm',
        roundStep: 50
    },

    7: {
        name: 'T2m',
        unit: '°C',
        roundStep: 5
    },

    13: {
        name: 'Precipitation',
        unit: 'mm',
        roundStep: 5
    }

};

/*
    Public CORS proxy. Direct browser fetches to
    meteociel.fr fail because that server does not
    send an Access-Control-Allow-Origin header for
    third-party origins. In production, replace this
    with a small server-side proxy you control instead
    of relying on a public one (rate limits/uptime vary).
*/
const CORS_PROXY = 'https://api.allorigins.win/raw?url=';


/* =========================================================
   UI
========================================================= */

function setStatus(text) {

    document.getElementById('statusText').textContent = text;

}

function showError(text) {

    const el = document.getElementById('errorMessage');

    el.textContent = text;

    el.style.display = 'block';

}

function hideError() {

    document.getElementById('errorMessage').style.display = 'none';

}

function showWarning(text) {

    const el = document.getElementById('warningMessage');

    el.textContent = text;

    el.style.display = 'block';

}

function hideWarning() {

    document.getElementById('warningMessage').style.display = 'none';

}

function showSuccess(text) {

    const el = document.getElementById('successMessage');

    el.textContent = text;

    el.style.display = 'block';

}

function hideSuccess() {

    document.getElementById('successMessage').style.display = 'none';

}

function debug(text) {

    const el = document.getElementById('debugBox');

    el.textContent = text;

    el.style.display = 'block';

}


/* =========================================================
   URL
========================================================= */

function buildUrl(lat, lon, mode, run) {

    const params = new URLSearchParams();

    params.set('x', '0');
    params.set('y', '0');
    params.set('lat', lat);
    params.set('lon', lon);
    params.set('run', run);
    params.set('ext', '1');
    params.set('mode', mode);
    params.set('sort', '0');
    params.set('aifs', '1');

    return (
        'https://www.meteociel.fr/modeles/' +
        'ecmwfens_table.php?' +
        params.toString()
    );

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(text) {

    if (!text) {
        return null;
    }

    const value = text
        .replace(/\u00a0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

    const match = value.match(
        /(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2})Z/i
    );

    if (!match) {
        return null;
    }

    return (
        `${match[1]}-${match[2]}-${match[3]} ` +
        `${String(match[4]).padStart(2, '0')}:00`
    );

}


/* =========================================================
   NUMBER PARSER
========================================================= */

function parseNumber(text) {

    if (text === null || text === undefined) {
        return null;
    }

    let value = String(text)
        .replace(/\u00a0/g, ' ')
        .trim();

    if (!value) {
        return null;
    }

    /*
        Keep only numeric representation.
    */

    value = value
        .replace(',', '.')
        .match(/[-+]?\d*\.?\d+/);

    if (!value) {
        return null;
    }

    const number = Number(value[0]);

    return Number.isFinite(number)
        ? number
        : null;

}


/* =========================================================
   METEOCIEL TABLE PARSER
========================================================= */

function parseTable(html, run) {

    const parser = new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            'text/html'
        );

    const tables =
        Array.from(
            doc.querySelectorAll('table')
        );

    console.log(
        `${run}Z: tables =`,
        tables.length
    );

    /*
        Search every table.
    */

    for (
        let tableNo = 0;
        tableNo < tables.length;
        tableNo++
    ) {

        const table =
            tables[tableNo];

        const rows =
            Array.from(
                table.querySelectorAll('tr')
            );

        if (!rows.length) {
            continue;
        }

        /*
            Find header row.
        */

        let headerIndex = -1;
        let dateIndex = -1;
        let detIndex = -1;

        for (
            let r = 0;
            r < rows.length;
            r++
        ) {

            const cells =
                Array.from(
                    rows[r].querySelectorAll(
                        'th,td'
                    )
                );

            const texts =
                cells.map(cell =>
                    cell.textContent
                        .replace(/\u00a0/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                        .toUpperCase()
                );

            const d =
                texts.findIndex(
                    x => x === 'DATE' ||
                         x.includes('DATE')
                );

            const det =
                texts.findIndex(
                    x => x === 'DET' ||
                         x.startsWith('DET ')
                );

            if (
                d !== -1 &&
                det !== -1
            ) {

                headerIndex = r;

                dateIndex = d;

                detIndex = det;

                break;
            }

        }

        if (headerIndex === -1) {
            continue;
        }

        console.log(
            `${run}Z: table=${tableNo}`,
            `date=${dateIndex}`,
            `det=${detIndex}`
        );

        const result = [];

        /*
            Parse rows after header.
        */

        for (
            let r = headerIndex + 1;
            r < rows.length;
            r++
        ) {

            const cells =
                Array.from(
                    rows[r].querySelectorAll(
                        'th,td'
                    )
                );

            if (!cells.length) {
                continue;
            }

            const texts =
                cells.map(cell =>
                    cell.textContent
                        .replace(/\u00a0/g, ' ')
                        .replace(/\s+/g, ' ')
                        .trim()
                );

            /*
                Find date anywhere in row.
            */

            let foundDate = null;

            for (
                const text of texts
            ) {

                const parsed =
                    parseDate(text);

                if (parsed) {

                    foundDate = parsed;

                    break;
                }

            }

            if (!foundDate) {
                continue;
            }

            /*
                DET position.
            */

            let detValue = null;

            if (
                detIndex >= 0 &&
                detIndex < texts.length
            ) {

                detValue =
                    parseNumber(
                        texts[detIndex]
                    );

            }

            /*
                If expected position failed,
                look around the DET column.
            */

            if (detValue === null) {

                for (
                    let c = detIndex;
                    c < texts.length;
                    c++
                ) {

                    const candidate =
                        parseNumber(
                            texts[c]
                        );

                    if (
                        candidate !== null
                    ) {

                        detValue =
                            candidate;

                        break;
                    }

                }

            }

            if (
                detValue === null
            ) {
                continue;
            }

            result.push({

                date: foundDate,

                value: detValue

            });

        }

        if (result.length) {

            /*
                Remove duplicate dates.
            */

            const map = new Map();

            for (
                const item of result
            ) {

                map.set(
                    item.date,
                    item.value
                );

            }

            return Array.from(
                map,
                ([date, value]) => ({
                    date,
                    value
                })
            );

        }

    }

    /*
        Fallback:
        parse page text directly.
    */

    const text =
        doc.body?.innerText || '';

    const lines =
        text.split(/\n+/);

    const fallback = [];

    for (
        const lineRaw of lines
    ) {

        const line =
            lineRaw.trim();

        const match =
            line.match(
                /^(\d{4}-\d{2}-\d{2})\s+(\d{1,2})Z(?:\s+)([-+]?\d*\.?\d+)/i
            );

        if (!match) {
            continue;
        }

        const date =
            `${match[1]} ` +
            `${String(match[2]).padStart(2, '0')}:00`;

        const value =
            Number(match[3]);

        if (
            Number.isFinite(value)
        ) {

            fallback.push({
                date,
                value
            });

        }

    }

    console.log(
        `${run}Z fallback =`,
        fallback.length
    );

    return fallback;

}


/* =========================================================
   DIRECT FETCH (via CORS proxy)
========================================================= */

async function fetchDirect(url) {

    const proxiedUrl =
        CORS_PROXY + encodeURIComponent(url);

    console.log(
        'PROXY GET:',
        proxiedUrl
    );

    const response =
        await fetch(
            proxiedUrl,
            {
                method: 'GET',
                cache: 'no-store'
            }
        );

    if (!response.ok) {

        throw new Error(
            `HTTP ${response.status} ${response.statusText}`
        );

    }

    const html =
        await response.text();

    if (!html) {

        throw new Error(
            'Meteociel returned an empty response'
        );

    }

    return html;

}


/* =========================================================
   MAIN
========================================================= */

async function fetchData() {

    const latRaw =
        document.getElementById('latInput').value.trim();

    const lonRaw =
        document.getElementById('lonInput').value.trim();

    const lat = Number(latRaw);

    const lon = Number(lonRaw);

    const mode =
        document.getElementById(
            'variableSelect'
        ).value;

    const config =
        VARIABLE_CONFIG[mode];

    const button =
        document.getElementById(
            'fetchBtn'
        );

    const loading =
        document.getElementById(
            'chartLoading'
        );


    /*
        Validate.
    */

    if (
        latRaw === '' ||
        !Number.isFinite(lat) ||
        lat < -90 ||
        lat > 90
    ) {

        showError(
            'Invalid latitude.'
        );

        return;
    }

    if (
        lonRaw === '' ||
        !Number.isFinite(lon) ||
        lon < -180 ||
        lon > 180
    ) {

        showError(
            'Invalid longitude.'
        );

        return;
    }


    button.disabled = true;

    loading.classList.add('active');

    hideError();
    hideWarning();
    hideSuccess();

    debug('');

    let logs = [];

    const runData = {};

    const dates = new Set();

    let successfulRuns = 0;


    try {

        for (
            const run of RUNS
        ) {

            const url =
                buildUrl(
                    lat,
                    lon,
                    mode,
                    run
                );

            setStatus(
                `Fetching ${run}Z...`
            );

            logs.push(
                `${run}Z URL:\n${url}`
            );


            try {

                const html =
                    await fetchDirect(
                        url
                    );

                logs.push(
                    `${run}Z response: ${html.length} bytes`
                );

                const parsed =
                    parseTable(
                        html,
                        run
                    );

                logs.push(
                    `${run}Z parsed: ${parsed.length}`
                );


                if (
                    parsed.length > 0
                ) {

                    successfulRuns++;

                    runData[run] = {};

                    for (
                        const item of parsed
                    ) {

                        runData[run][
                            item.date
                        ] = item.value;

                        dates.add(
                            item.date
                        );

                    }

                }

            } catch (error) {

                console.error(
                    `${run}Z`,
                    error
                );

                logs.push(
                    `${run}Z ERROR: ${error.message}`
                );

            }

            /*
                Delay between requests.
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        500
                    )
            );

        }


        debug(
            logs.join('\n\n')
        );


        if (!dates.size) {

            throw new Error(
                'No data parsed from Meteociel.'
            );

        }


        /*
            Merge runs.
        */

        const merged = {};

        for (
            const date of dates
        ) {

            merged[date] = {

                points_0:
                    runData[0]?.[date] ??
                    null,

                points_6:
                    runData[6]?.[date] ??
                    null,

                points_12:
                    runData[12]?.[date] ??
                    null,

                points_18:
                    runData[18]?.[date] ??
                    null

            };

        }


        updateChart(
            merged,
            config,
            lat,
            lon
        );


        if (successfulRuns === RUNS.length) {

            showSuccess(
                `${successfulRuns}/${RUNS.length} runs loaded — ${dates.size} timestamps`
            );

        } else {

            showWarning(
                `Only ${successfulRuns}/${RUNS.length} runs loaded — ${dates.size} timestamps (some runs failed)`
            );

        }

        setStatus(
            `${dates.size} forecast timestamps`
        );


    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message
        );

        setStatus(
            'Failed'
        );

    } finally {

        button.disabled = false;

        loading.classList.remove(
            'active'
        );

    }

}


/* =========================================================
   CHART
========================================================= */

function updateChart(
    data,
    config,
    lat,
    lon
) {

    const dates =
        Object.keys(data).sort();

    if (!dates.length) {
        return;
    }


    let allValues = [];

    for (
        const run of RUNS
    ) {

        const key =
            `points_${run}`;

        for (
            const date of dates
        ) {

            const value =
                data[date][key];

            if (
                value !== null &&
                Number.isFinite(value)
            ) {

                allValues.push(
                    value
                );

            }

        }

    }


    if (!allValues.length) {
        return;
    }


    const step =
        config.roundStep;

    const minValue =
        Math.min(...allValues);

    const maxValue =
        Math.max(...allValues);

    let yMin =
        Math.floor(
            minValue / step
        ) * step;

    let yMax =
        Math.ceil(
            maxValue / step
        ) * step;


    if (yMin === yMax) {

        yMin -= step;

        yMax += step;

    }


    if (
        config.name ===
        'Precipitation' &&
        yMin > 0
    ) {

        yMin = 0;

    }


    const labels =
        dates.map(
            date => {

                const parts =
                    date.split(' ');

                const d =
                    parts[0].split('-');

                const hour =
                    parts[1]
                        .split(':')[0];

                return (
                    `${d[2]}.${d[1]} ${hour}z`
                );

            }
        );


    const datasets = [];


    for (
        const run of RUNS
    ) {

        const key =
            `points_${run}`;

        datasets.push({

            label:
                `${run}Z Run`,

            data:
                dates.map(
                    date =>
                        data[date][key]
                ),

            borderColor:
                COLORS[run],

            backgroundColor:
                COLORS[run],

            borderWidth: 2,

            pointRadius: 2,

            pointHoverRadius: 4,

            tension: 0,

            spanGaps: true,

            fill: false

        });

    }


    if (chart) {

        chart.destroy();

        chart = null;

    }


    chart =
        new Chart(
            document
                .getElementById(
                    'forecastChart'
                )
                .getContext('2d'),

            {

                type: 'line',

                data: {

                    labels,

                    datasets

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    interaction: {

                        intersect: false,

                        mode: 'index'

                    },

                    plugins: {

                        legend: {

                            display: true,

                            position: 'top',

                            labels: {

                                color:
                                    '#cbd5e1',

                                font: {

                                    family:
                                        'Inter',

                                    size: 12

                                }

                            }

                        },

                        title: {

                            display: true,

                            text:
                                `${config.name} Forecast — ${lat}°N, ${lon}°E`,

                            color:
                                '#f1f5f9',

                            font: {

                                family:
                                    'Inter',

                                size: 18,

                                weight:
                                    '600'

                            }

                        },

                        tooltip: {

                            callbacks: {

                                label:
                                    function(context) {

                                        if (
                                            context.parsed.y === null
                                        ) {

                                            return context
                                                .dataset
                                                .label +
                                                ': no data';

                                        }

                                        return (
                                            context
                                                .dataset
                                                .label +
                                            ': ' +
                                            context
                                                .parsed
                                                .y
                                                .toFixed(1) +
                                            ' ' +
                                            config.unit
                                        );

                                    }

                            }

                        }

                    },

                    scales: {

                        x: {

                            ticks: {

                                color:
                                    '#cbd5e1',

                                autoSkip: false,

                                maxRotation: 0,

                                callback:
                                    function(
                                        value,
                                        index
                                    ) {

                                        const label =
                                            labels[index];

                                        if (
                                            label?.endsWith(
                                                '00z'
                                            )
                                        ) {

                                            return label
                                                .split(' ')[0];

                                        }

                                        return '';

                                    }

                            },

                            grid: {

                                color:
                                    'rgba(148,163,184,.15)'

                            }

                        },

                        y: {

                            min: yMin,

                            max: yMax,

                            ticks: {

                                color:
                                    '#cbd5e1'

                            },

                            title: {

                                display: true,

                                text:
                                    `${config.name} (${config.unit})`,

                                color:
                                    '#cbd5e1'

                            },

                            grid: {

                                color:
                                    'rgba(148,163,184,.10)'

                            }

                        }

                    }

                }

            }

        );

}
