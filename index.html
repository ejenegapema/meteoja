<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECMWF AIFS Weather Forecast</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/2.1.0/chartjs-plugin-annotation.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.header-info {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.header-info h1 {
    color: #f1f5f9;
    font-weight: 700;
    margin: 0 0 10px 0;
    font-size: 32px;
}

.header-info .info-line {
    color: #cbd5e1;
    font-size: 18px;
    font-weight: 500;
    margin: 5px 0;
}

.error-message,
.warning-message,
.success-message {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    width: 100%;
    text-align: center;
    display: none;
}

.error-message {
    color: #ef4444;
    background: #2e1f1f;
    border: 1px solid #7f1d1d;
    font-size: 15px;
    font-weight: 500;
}

.warning-message {
    color: #f59e0b;
    background: #2e2410;
    border: 1px solid #78350f;
    font-size: 14px;
}

.success-message {
    color: #10b981;
    background: #1a2e26;
    border: 1px solid #064e3b;
    font-size: 14px;
}

.form-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    width: 100%;
}

.form-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: flex-end;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-label {
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 500;
}

.form-select {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #475569;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    min-width: 200px;
    height: 42px;
}

.form-select:focus {
    outline: none;
    border-color: #3b82f6;
}

.form-select option {
    background: #1e293b;
    color: #e2e8f0;
}

.form-input {
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #475569;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    width: 120px;
    height: 42px;
}

.form-input:focus {
    outline: none;
    border-color: #3b82f6;
}

.form-input::placeholder {
    color: #64748b;
}

.submit-btn {
    background: #3b82f6;
    color: #ffffff;
    border: none;
    padding: 10px 24px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.2s;
    height: 42px;
}

.submit-btn:hover {
    background: #2563eb;
}

.submit-btn:disabled {
    background: #475569;
    cursor: not-allowed;
}

.chart-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    width: 100%;
    position: relative;
}

.chart-wrapper {
    position: relative;
    height: 400px;
}

.chart-loading {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(30, 41, 59, 0.8);
    border-radius: 12px;
    z-index: 10;
}

.chart-loading.active {
    display: flex;
}

.chart-spinner {
    border: 4px solid rgba(59, 130, 246, 0.1);
    border-radius: 50%;
    border-top: 4px solid #3b82f6;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

.status-text {
    color: #cbd5e1;
    font-size: 14px;
    text-align: center;
    margin-top: 10px;
}

.debug-box {
    margin-top: 15px;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #94a3b8;
    font-size: 12px;
    white-space: pre-wrap;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="header-info">
        <h1>ECMWF AIFS Weather Forecast</h1>
        <div class="info-line">Model Run - 0Z, 6Z, 12Z, 18Z</div>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="warning-message" id="warningMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <div class="form-container">

        <div class="form-grid">

            <div class="form-group">
                <label class="form-label" for="latInput">Latitude</label>
                <input
                    type="number"
                    class="form-input"
                    id="latInput"
                    placeholder="42.5"
                    value="42.5"
                    step="0.1"
                    min="-90"
                    max="90"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="lonInput">Longitude</label>
                <input
                    type="number"
                    class="form-input"
                    id="lonInput"
                    placeholder="42.0"
                    value="42.0"
                    step="0.1"
                    min="-180"
                    max="180"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="variableSelect">
                    Weather Variable
                </label>

                <select class="form-select" id="variableSelect">
                    <option value="7">T2m</option>
                    <option value="0">T850</option>
                    <option value="4">Z500</option>
                    <option value="2">MSLP</option>
                    <option value="13">Precipitation</option>
                </select>
            </div>

            <div class="form-group">
                <button class="submit-btn" onclick="fetchData()" id="fetchBtn">
                    Update
                </button>
            </div>

        </div>

    </div>

    <div class="chart-container">

        <div class="chart-loading" id="chartLoading">
            <div class="chart-spinner"></div>
        </div>

        <div class="chart-wrapper">
            <canvas id="forecastChart"></canvas>
        </div>

        <div class="status-text" id="statusText">
            Ready
        </div>

        <div class="debug-box" id="debugBox"></div>

    </div>

</div>

<script>

let chart = null;

const colors = {
    0: {
        line: '#53a0e5',
        bg: 'rgba(83, 160, 229, 0.10)'
    },
    6: {
        line: '#ffea00',
        bg: 'rgba(255, 234, 0, 0.10)'
    },
    12: {
        line: '#1cc412',
        bg: 'rgba(28, 196, 18, 0.10)'
    },
    18: {
        line: '#ff0000',
        bg: 'rgba(255, 0, 0, 0.10)'
    }
};

const variableConfig = {

    '13': {
        name: 'Precipitation',
        unit: 'mm',
        roundStep: 50
    },

    '0': {
        name: 'T850',
        unit: '°C',
        roundStep: 5
    },

    '2': {
        name: 'MSLP',
        unit: 'hPa',
        roundStep: 10
    },

    '7': {
        name: 'T2m',
        unit: '°C',
        roundStep: 5
    },

    '4': {
        name: 'Z500',
        unit: 'dm',
        roundStep: 50
    }

};


/* ---------------------------------------------------------
   UI
--------------------------------------------------------- */

function showError(message) {

    const el = document.getElementById('errorMessage');

    el.textContent = message;
    el.style.display = 'block';
}

function hideError() {

    document.getElementById('errorMessage').style.display = 'none';
}

function showWarning(message) {

    const el = document.getElementById('warningMessage');

    el.textContent = message;
    el.style.display = 'block';
}

function hideWarning() {

    document.getElementById('warningMessage').style.display = 'none';
}

function showSuccess(message) {

    const el = document.getElementById('successMessage');

    el.textContent = message;
    el.style.display = 'block';
}

function hideSuccess() {

    document.getElementById('successMessage').style.display = 'none';
}

function setStatus(message) {

    const el = document.getElementById('statusText');

    if (el) {
        el.textContent = message;
    }
}

function showDebug(message) {

    const el = document.getElementById('debugBox');

    if (!el) return;

    el.textContent = message;
    el.style.display = 'block';
}


/* ---------------------------------------------------------
   Helpers
--------------------------------------------------------- */

function roundToStep(value, step, roundUp = false) {

    if (!Number.isFinite(value)) {
        return 0;
    }

    return roundUp
        ? Math.ceil(value / step) * step
        : Math.floor(value / step) * step;
}


function normalizeCellText(value) {

    return String(value ?? '')
        .replace(/\u00a0/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}


/*
    Meteociel currently uses rows similar to:

    Date        Ech.   DET   1   2   3 ...
    2026-09-08 00Z      0  15.9 16 ...

    We do NOT assume:
    - first row is header
    - headers are <th>
    - exact capitalization
    - exact whitespace
*/

function parseMeteocielDate(text) {

    if (!text) {
        return null;
    }

    const clean = normalizeCellText(text);

    /*
        Current format:
        2026-09-08 00Z
    */

    let match = clean.match(
        /(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2})Z/i
    );

    if (!match) {
        /*
            Sometimes additional whitespace/text can occur.
        */

        match = clean.match(
            /(\d{4})-(\d{2})-(\d{2}).*?(\d{1,2})Z/i
        );
    }

    if (!match) {
        return null;
    }

    const year = match[1];
    const month = match[2];
    const day = match[3];
    const hour = String(match[4]).padStart(2, '0');

    return `${year}-${month}-${day} ${hour}:00`;
}


function parseNumericValue(text) {

    if (text === null || text === undefined) {
        return null;
    }

    let value = normalizeCellText(text);

    if (!value) {
        return null;
    }

    /*
        Remove common decorations.
    */

    value = value
        .replace(',', '.')
        .replace(/[^0-9eE+.\-]/g, '');

    if (!value) {
        return null;
    }

    const number = Number(value);

    return Number.isFinite(number) ? number : null;
}


/* ---------------------------------------------------------
   Robust Meteociel parser
--------------------------------------------------------- */

function parseTable(html, runNumber) {

    if (!html || html.length < 100) {
        console.warn(`${runNumber}Z: empty HTML`);
        return [];
    }

    const parser = new DOMParser();

    const doc = parser.parseFromString(html, 'text/html');

    const tables = Array.from(doc.querySelectorAll('table'));

    console.log(
        `${runNumber}Z: found ${tables.length} tables`
    );

    for (let tableIndex = 0; tableIndex < tables.length; tableIndex++) {

        const table = tables[tableIndex];

        const rows = Array.from(table.querySelectorAll('tr'));

        if (!rows.length) {
            continue;
        }

        let dateIndex = -1;
        let detIndex = -1;
        let headerRowIndex = -1;

        /*
            Find ANY row containing DATE + DET.
        */

        for (let r = 0; r < rows.length; r++) {

            const cells = Array.from(
                rows[r].querySelectorAll('th, td')
            );

            const texts = cells.map(cell =>
                normalizeCellText(cell.textContent)
            );

            for (let c = 0; c < texts.length; c++) {

                const normalized = texts[c]
                    .toUpperCase()
                    .replace(/\./g, '')
                    .trim();

                if (
                    normalized === 'DATE' ||
                    normalized.includes('DATE')
                ) {
                    dateIndex = c;
                }

                if (
                    normalized === 'DET' ||
                    normalized.startsWith('DET ')
                ) {
                    detIndex = c;
                }
            }

            if (dateIndex !== -1 && detIndex !== -1) {

                headerRowIndex = r;

                break;
            }
        }

        /*
            If exact DET header was not found,
            look for a row whose first columns resemble:

            Date / Ech. / DET
        */

        if (headerRowIndex === -1) {

            for (let r = 0; r < rows.length; r++) {

                const cells = Array.from(
                    rows[r].querySelectorAll('th, td')
                );

                const texts = cells.map(cell =>
                    normalizeCellText(cell.textContent)
                        .toUpperCase()
                );

                const dateCandidate = texts.findIndex(v =>
                    v.includes('DATE')
                );

                const detCandidate = texts.findIndex(v =>
                    v === 'DET' || v.startsWith('DET')
                );

                if (
                    dateCandidate !== -1 &&
                    detCandidate !== -1
                ) {

                    dateIndex = dateCandidate;
                    detIndex = detCandidate;
                    headerRowIndex = r;

                    break;
                }
            }
        }

        /*
            No useful header => next table.
        */

        if (
            headerRowIndex === -1 ||
            dateIndex === -1 ||
            detIndex === -1
        ) {
            continue;
        }

        console.log(
            `${runNumber}Z: table ${tableIndex}, dateIndex=${dateIndex}, detIndex=${detIndex}`
        );

        const data = [];

        /*
            Parse all rows AFTER the header.
        */

        for (
            let r = headerRowIndex + 1;
            r < rows.length;
            r++
        ) {

            const cells = Array.from(
                rows[r].querySelectorAll('th, td')
            );

            if (!cells.length) {
                continue;
            }

            /*
                Normal case: same column positions.
            */

            const texts = cells.map(cell =>
                normalizeCellText(cell.textContent)
            );

            let dateText = texts[dateIndex] || '';
            let detText = texts[detIndex] || '';

            /*
                If the row structure shifted,
                search the row for the date explicitly.
            */

            if (!parseMeteocielDate(dateText)) {

                const foundDateIndex = texts.findIndex(text =>
                    parseMeteocielDate(text) !== null
                );

                if (foundDateIndex !== -1) {

                    dateText = texts[foundDateIndex];

                    /*
                        DET is normally directly after Ech.
                        Use the original detIndex if available.
                    */
                }
            }

            const dateKey = parseMeteocielDate(dateText);

            if (!dateKey) {
                continue;
            }

            let detValue = parseNumericValue(detText);

            /*
                If DET wasn't found in the expected location,
                find the first numeric cell after the date,
                preferring the column corresponding to DET.
            */

            if (detValue === null) {

                const numericCandidates = texts
                    .map((text, index) => ({
                        index,
                        value: parseNumericValue(text)
                    }))
                    .filter(item =>
                        item.value !== null
                    );

                const candidate = numericCandidates.find(
                    item => item.index >= detIndex
                );

                if (candidate) {
                    detValue = candidate.value;
                }
            }

            if (detValue === null) {
                continue;
            }

            data.push({
                date: dateKey,
                value: detValue
            });
        }

        /*
            Remove duplicate timestamps.
        */

        if (data.length > 0) {

            const unique = [];
            const seen = new Set();

            for (const item of data) {

                if (seen.has(item.date)) {
                    continue;
                }

                seen.add(item.date);
                unique.push(item);
            }

            console.log(
                `${runNumber}Z: parsed ${unique.length} data points`
            );

            return unique;
        }
    }

    /*
        FALLBACK PARSER

        This is important because even when the table DOM
        changes, the actual textual data may still be present.
    */

    const fallbackData = [];

    const bodyText = normalizeCellText(
        doc.body?.innerText || doc.body?.textContent || ''
    );

    const lines = bodyText
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean);

    for (const line of lines) {

        const match = line.match(
            /^(\d{4}-\d{2}-\d{2})\s+(\d{1,2})Z\s+(-?\d+(?:[.,]\d+)?)/i
        );

        if (!match) {
            continue;
        }

        const date = `${match[1]} ${String(match[2]).padStart(2, '0')}:00`;
        const value = parseNumericValue(match[3]);

        if (value !== null) {
            fallbackData.push({
                date,
                value
            });
        }
    }

    if (fallbackData.length > 0) {

        console.log(
            `${runNumber}Z: fallback parser found ${fallbackData.length} points`
        );

        return fallbackData;
    }

    console.warn(
        `${runNumber}Z: parser found no usable data`
    );

    return [];
}


/* ---------------------------------------------------------
   Fetching
--------------------------------------------------------- */

/*
    Current CorsProxy syntax is:

    https://corsproxy.io/?url=<encoded URL>

    This is different from your original code.
*/

const PROXIES = [

    url =>
        `https://corsproxy.io/?url=${encodeURIComponent(url)}`

];


/*
    Try direct request first.

    If CORS blocks it, try proxy.
*/

async function fetchDirect(url) {

    const response = await fetch(url, {
        method: 'GET',
        cache: 'no-store'
    });

    if (!response.ok) {
        throw new Error(`Direct HTTP ${response.status}`);
    }

    const html = await response.text();

    if (!html || html.length < 100) {
        throw new Error('Direct response empty');
    }

    return html;
}


async function fetchWithProxy(url) {

    let lastError = null;

    for (let i = 0; i < PROXIES.length; i++) {

        try {

            const proxyUrl = PROXIES[i](url);

            console.log(
                'Proxy request:',
                proxyUrl
            );

            const response = await fetch(proxyUrl, {
                method: 'GET',
                cache: 'no-store',
                headers: {
                    'Accept':
                        'text/html,application/xhtml+xml,text/plain,*/*'
                }
            });

            if (!response.ok) {
                throw new Error(
                    `Proxy HTTP ${response.status}`
                );
            }

            const html = await response.text();

            if (!html || html.length < 100) {
                throw new Error(
                    'Proxy response empty or too short'
                );
            }

            return html;

        } catch (error) {

            lastError = error;

            console.error(
                'Proxy failed:',
                error
            );
        }
    }

    throw lastError ||
        new Error('All proxy servers failed');
}


async function fetchMeteociel(url) {

    /*
        First try direct.
    */

    try {

        setStatus('Trying Meteociel directly...');

        return await fetchDirect(url);

    } catch (directError) {

        console.warn(
            'Direct request failed:',
            directError.message
        );
    }

    /*
        Then proxy.
    */

    setStatus('Using CORS proxy...');

    return await fetchWithProxy(url);
}


/* ---------------------------------------------------------
   Main fetch
--------------------------------------------------------- */

async function fetchData() {

    const latInput =
        document.getElementById('latInput');

    const lonInput =
        document.getElementById('lonInput');

    const variableSelect =
        document.getElementById('variableSelect');

    const fetchBtn =
        document.getElementById('fetchBtn');

    const loading =
        document.getElementById('chartLoading');


    const lat = parseFloat(latInput.value);
    const lon = parseFloat(lonInput.value);

    /*
        Validation
    */

    if (
        !Number.isFinite(lat) ||
        lat < -90 ||
        lat > 90
    ) {

        showError(
            'Invalid latitude. Must be between -90 and 90.'
        );

        return;
    }

    if (
        !Number.isFinite(lon) ||
        lon < -180 ||
        lon > 180
    ) {

        showError(
            'Invalid longitude. Must be between -180 and 180.'
        );

        return;
    }


    const runs = [0, 6, 12, 18];

    const mode = variableSelect.value;

    const config = variableConfig[mode];

    if (!config) {

        showError(
            'Unknown weather variable.'
        );

        return;
    }


    /*
        IMPORTANT:
        Keep RUN as a unique token.
        Do not use a simple .replace() on the whole URL
        with a value that might occur elsewhere.
    */

    function buildUrl(run) {

        const params = new URLSearchParams({
            x: '0',
            y: '0',
            lat: String(lat),
            lon: String(lon),
            run: String(run),
            ext: '1',
            mode: String(mode),
            sort: '0',
            aifs: '1'
        });

        return (
            'https://www.meteociel.fr/modeles/' +
            'ecmwfens_table.php?' +
            params.toString()
        );
    }


    /*
        UI
    */

    fetchBtn.disabled = true;

    loading.classList.add('active');

    hideError();
    hideWarning();
    hideSuccess();

    document.getElementById('debugBox').style.display =
        'none';

    setStatus('Starting...');


    const runData = {};

    const allDates = new Set();

    let successCount = 0;

    const debugMessages = [];


    try {

        /*
            Sequential requests reduce the chance of
            being blocked/rate-limited.
        */

        for (const run of runs) {

            setStatus(
                `Loading ${run}Z run...`
            );

            const url = buildUrl(run);

            console.log(
                `${run}Z URL:`,
                url
            );

            try {

                const html =
                    await fetchMeteociel(url);

                debugMessages.push(
                    `${run}Z: received ${html.length.toLocaleString()} bytes`
                );

                const data =
                    parseTable(html, run);

                if (data.length > 0) {

                    successCount++;

                    runData[run] = {};

                    for (const item of data) {

                        runData[run][item.date] =
                            item.value;

                        allDates.add(item.date);
                    }

                    debugMessages.push(
                        `${run}Z: ${data.length} points parsed`
                    );

                } else {

                    debugMessages.push(
                        `${run}Z: NO points parsed`
                    );
                }

            } catch (error) {

                console.error(
                    `${run}Z failed:`,
                    error
                );

                debugMessages.push(
                    `${run}Z ERROR: ${error.message}`
                );
            }


            /*
                Small delay between requests.
            */

            if (run !== 18) {

                await new Promise(resolve =>
                    setTimeout(resolve, 1000)
                );
            }
        }


        showDebug(
            debugMessages.join('\n')
        );


        /*
            Nothing found
        */

        if (allDates.size === 0) {

            throw new Error(
                'No forecast data could be extracted. ' +
                'Open the browser console (F12) to see the ' +
                'Meteociel/proxy response details.'
            );
        }


        /*
            Sort ISO timestamps.
        */

        const sortedDates =
            Array.from(allDates).sort();


        /*
            Merge
        */

        const mergedData = {};

        for (const date of sortedDates) {

            mergedData[date] = {

                points_0:
                    runData[0]?.[date] ?? null,

                points_6:
                    runData[6]?.[date] ?? null,

                points_12:
                    runData[12]?.[date] ?? null,

                points_18:
                    runData[18]?.[date] ?? null

            };
        }


        /*
            Draw chart
        */

        updateChart(
            mergedData,
            config,
            lat,
            lon
        );


        /*
            Status
        */

        if (successCount === runs.length) {

            showSuccess(
                `Loaded all ${runs.length} ECMWF AIFS runs. ` +
                `${sortedDates.length} forecast timestamps.`
            );

        } else {

            showWarning(
                `Loaded ${successCount} of ${runs.length} runs.`
            );
        }

        setStatus(
            `${sortedDates.length} timestamps loaded`
        );

    } catch (error) {

        console.error(
            'Forecast error:',
            error
        );

        showError(
            error.message
        );

        setStatus(
            'Failed to fetch data'
        );

    } finally {

        fetchBtn.disabled = false;

        loading.classList.remove('active');
    }
}


/* ---------------------------------------------------------
   Chart
--------------------------------------------------------- */

function updateChart(
    data,
    config,
    lat,
    lon
) {

    const dates =
        Object.keys(data).sort();

    if (!dates.length) {

        showError(
            'No data available for chart.'
        );

        return;
    }


    /*
        Collect all values
    */

    let allValues = [];

    for (const run of [0, 6, 12, 18]) {

        const key = `points_${run}`;

        const values = dates

            .map(date =>
                data[date][key]
            )

            .filter(value =>
                value !== null &&
                Number.isFinite(value)
            );

        allValues =
            allValues.concat(values);
    }


    if (!allValues.length) {

        showError(
            'Forecast rows were found, but no numeric values were found.'
        );

        return;
    }


    const dataMin =
        Math.min(...allValues);

    const dataMax =
        Math.max(...allValues);

    const step =
        config.roundStep;


    let yMin =
        roundToStep(
            dataMin,
            step,
            false
        );

    let yMax =
        roundToStep(
            dataMax,
            step,
            true
        );


    /*
        Prevent identical min/max.
    */

    if (yMin === yMax) {

        yMin -= step;

        yMax += step;
    }


    if (
        config.name === 'Precipitation' &&
        yMin > 0
    ) {

        yMin = 0;
    }


    /*
        Format X labels
    */

    const formattedLabels =
        dates.map(dateStr => {

            const parts =
                dateStr.split(' ');

            if (parts.length < 2) {
                return dateStr;
            }

            const dateParts =
                parts[0].split('-');

            const timeParts =
                parts[1].split(':');

            if (
                dateParts.length === 3 &&
                timeParts.length >= 1
            ) {

                const day =
                    dateParts[2];

                const month =
                    dateParts[1];

                const hour =
                    timeParts[0];

                return `${day}.${month} ${hour}z`;
            }

            return dateStr;
        });


    /*
        Datasets
    */

    const datasets = [];

    const runLabels = [];


    for (const run of [0, 6, 12, 18]) {

        const key =
            `points_${run}`;

        const values =
            dates.map(date =>
                data[date][key]
            );


        const firstValueIndex =
            values.findIndex(
                value =>
                    value !== null
            );


        if (firstValueIndex !== -1) {

            runLabels.push({

                run,

                x: firstValueIndex,

                y: values[firstValueIndex],

                color:
                    colors[run].line

            });
        }


        datasets.push({

            label: `${run}Z Run`,

            data: values,

            borderColor:
                colors[run].line,

            backgroundColor:
                colors[run].bg,

            borderWidth: 2,

            pointRadius: 2,

            pointHoverRadius: 4,

            tension: 0,

            fill: false,

            spanGaps: true,

            pointBorderWidth: 1,

            pointHoverBorderColor:
                '#ffffff',

            pointHoverBorderWidth: 2
        });
    }


    /*
        Destroy previous chart
    */

    if (chart) {

        chart.destroy();

        chart = null;
    }


    const canvas =
        document.getElementById(
            'forecastChart'
        );

    const ctx =
        canvas.getContext('2d');


    /*
        New chart
    */

    chart = new Chart(
        ctx,
        {

            type: 'line',

            data: {

                labels:
                    formattedLabels,

                datasets
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                interaction: {

                    intersect: false,

                    mode: 'index'
                },


                plugins: {

                    legend: {

                        display: true,

                        position: 'top',

                        labels: {

                            color: '#cbd5e1',

                            font: {

                                size: 12,

                                family: 'Inter'
                            }
                        }
                    },


                    tooltip: {

                        backgroundColor:
                            'rgba(30, 41, 59, 0.95)',

                        borderColor:
                            '#3b82f6',

                        borderWidth: 2,

                        titleColor:
                            '#f1f5f9',

                        bodyColor:
                            '#cbd5e1',

                        padding: 12,

                        cornerRadius: 8,


                        callbacks: {

                            label(context) {

                                let label =
                                    context.dataset.label ||
                                    '';

                                if (label) {
                                    label += ': ';
                                }

                                const value =
                                    context.parsed.y;

                                if (
                                    value !== null &&
                                    Number.isFinite(value)
                                ) {

                                    label +=
                                        Number(value)
                                            .toFixed(1) +
                                        ' ' +
                                        config.unit;
                                }

                                return label;
                            }
                        }
                    },


                    annotation: {

                        annotations:

                            runLabels.reduce(
                                (acc, label, index) => {

                                    acc[
                                        `label${index}`
                                    ] = {

                                        type: 'label',

                                        xValue:
                                            label.x,

                                        yValue:
                                            label.y,

                                        content:
                                            [
                                                `${label.run}Z`
                                            ],

                                        backgroundColor:
                                            label.color,

                                        color: 'white',

                                        font: {

                                            size: 11,

                                            weight:
                                                'bold'
                                        },

                                        padding: 4,

                                        borderRadius: 4,

                                        yAdjust: -20
                                    };

                                    return acc;

                                },

                                {}
                            )
                    },


                    title: {

                        display: true,

                        text:
                            `${config.name} Forecast - ` +
                            `${lat}°N, ${lon}°E`,

                        color:
                            '#f1f5f9',

                        font: {

                            size: 18,

                            family: 'Inter',

                            weight: '600'
                        },

                        padding: {

                            top: 0,

                            bottom: 20
                        }
                    }
                },


                scales: {

                    x: {

                        ticks: {

                            color:
                                '#cbd5e1',

                            font: {

                                size: 13,

                                family:
                                    'Inter',

                                weight:
                                    '500'
                            },

                            maxRotation: 0,

                            minRotation: 0,

                            autoSkip: false,

                            callback:
                                function (
                                    value,
                                    index
                                ) {

                                    const label =
                                        formattedLabels[
                                            index
                                        ];

                                    if (
                                        label &&
                                        label.endsWith(
                                            '00z'
                                        )
                                    ) {

                                        return label
                                            .split(' ')[0];
                                    }

                                    return '';
                                }
                        },


                        grid: {

                            color:
                                function (
                                    context
                                ) {

                                    const label =
                                        formattedLabels[
                                            context.index
                                        ];

                                    if (
                                        label &&
                                        label.endsWith(
                                            '00z'
                                        )
                                    ) {

                                        return 'rgba(148, 163, 184, 0.3)';
                                    }

                                    return 'transparent';
                                },

                            lineWidth: 1
                        },

                        border: {

                            color:
                                'rgba(148, 163, 184, 0.2)'
                        }
                    },


                    y: {

                        min: yMin,

                        max: yMax,


                        title: {

                            display: true,

                            text:
                                `${config.name} (${config.unit})`,

                            color:
                                '#cbd5e1',

                            font: {

                                size: 14,

                                family: 'Inter',

                                weight: '500'
                            }
                        },


                        ticks: {

                            color:
                                '#cbd5e1',

                            font: {

                                size: 14,

                                family: 'Inter',

                                weight: '500'
                            }
                        },


                        grid: {

                            color:
                                'rgba(148, 163, 184, 0.1)'
                        },

                        border: {

                            color:
                                'rgba(148, 163, 184, 0.2)'
                        }
                    }
                },


                animation: {

                    duration: 600,

                    easing: 'easeOutQuart'
                }
            }
        }
    );
}
