<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open-Meteo Weather Model Comparison</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    font-family: Inter, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
}

.container { max-width: 1200px; margin: auto; padding: 20px; }

.header-info {
    text-align: center;
    margin-bottom: 30px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.header-info h1 { margin: 0 0 10px; color: #f1f5f9; font-size: 32px; }
.info-line { color: #cbd5e1; font-size: 16px; }

.message {
    display: none;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
}

#errorMessage { color: #ef4444; background: #2e1f1f; border: 1px solid #7f1d1d; }
#warningMessage { color: #f59e0b; background: #2e2410; border: 1px solid #78350f; }
#successMessage { color: #10b981; background: #1a2e26; border: 1px solid #064e3b; }

.form-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.form-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    align-items: flex-end;
}

.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-label { color: #cbd5e1; font-size: 14px; }

.form-input,
.form-select {
    height: 42px;
    background: #0f172a;
    color: #e2e8f0;
    border: 1px solid #475569;
    border-radius: 8px;
    padding: 10px 16px;
    font-family: Inter, sans-serif;
}

.form-input { width: 120px; }
.form-select { min-width: 220px; }

.submit-btn {
    height: 42px;
    padding: 10px 24px;
    border: 0;
    border-radius: 9px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:disabled { background: #475569; cursor: wait; }

.chart-container {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    position: relative;
}

.chart-wrapper { position: relative; height: 450px; }

.chart-loading {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(30, 41, 59, 0.8);
    z-index: 10;
}

.chart-loading.active { display: flex; }

.spinner {
    width: 60px;
    height: 60px;
    border: 4px solid rgba(59,130,246,.15);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.status-text {
    text-align: center;
    margin-top: 12px;
    color: #94a3b8;
    font-size: 13px;
}

.debug {
    margin-top: 15px;
    padding: 12px;
    background: #020617;
    border-radius: 8px;
    color: #94a3b8;
    font: 12px monospace;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow: auto;
}

.source-note {
    text-align: center;
    margin-top: 10px;
    color: #64748b;
    font-size: 12px;
}

.source-note a { color: #60a5fa; }
</style>
</head>

<body>

<div class="container">

    <div class="header-info">
        <h1>Open-Meteo Weather Model Comparison</h1>
        <div class="info-line">ECMWF IFS · GFS · ICON · NCEP HGEFS (AI Ensemble Mean)</div>
    </div>

    <div id="errorMessage" class="message" role="alert"></div>
    <div id="warningMessage" class="message" role="alert"></div>
    <div id="successMessage" class="message" role="status"></div>

    <div class="form-container">
        <div class="form-grid">

            <div class="form-group">
                <label class="form-label" for="latInput">Latitude</label>
                <input id="latInput" class="form-input" type="number" value="52.52" step="0.01" min="-90" max="90">
            </div>

            <div class="form-group">
                <label class="form-label" for="lonInput">Longitude</label>
                <input id="lonInput" class="form-input" type="number" value="13.41" step="0.01" min="-180" max="180">
            </div>

            <div class="form-group">
                <label class="form-label" for="variableSelect">Weather Variable</label>
                <select id="variableSelect" class="form-select">
                    <option value="temperature_2m">T2m (2m Temperature)</option>
                    <option value="temperature_925hPa" selected>T925 (925 hPa Temperature)</option>
                    <option value="temperature_850hPa">T850 (850 hPa Temperature)</option>
                    <option value="geopotential_height_500hPa">Z500 (500 hPa Geopotential Height)</option>
                    <option value="pressure_msl">MSLP (Mean Sea Level Pressure)</option>
                    <option value="precipitation">Precipitation</option>
                </select>
            </div>

            <div class="form-group">
                <button id="fetchBtn" type="button" class="submit-btn" onclick="fetchData()">Update</button>
            </div>

        </div>
    </div>

    <div class="chart-container">
        <div id="chartLoading" class="chart-loading"><div class="spinner"></div></div>
        <div class="chart-wrapper"><canvas id="forecastChart"></canvas></div>
        <div id="statusText" class="status-text">Ready</div>
        <div id="debugBox" class="debug"></div>
    </div>

    <div class="source-note">
        Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> — free weather API, CC BY 4.0
    </div>

</div>

<script>

let chart = null;

/* =========================================================
   CONFIG
========================================================= */

const BASE_URL = 'https://api.open-meteo.com/v1/forecast';

/*
    Each "model" plays the role the four run-times (0Z/6Z/12Z/18Z)
    used to play in the old meteociel version: one colored line
    per source, all sharing the same variable/location.
*/
const MODELS = [
    { id: 'ecmwf_ifs025',                label: 'ECMWF IFS',        color: '#53a0e5' },
    { id: 'gfs_seamless',                label: 'GFS',               color: '#ffea00' },
    { id: 'icon_seamless',               label: 'ICON',              color: '#1cc412' },
    { id: 'ncep_hgefs025_ensemble_mean', label: 'NCEP HGEFS (AI Ens. Mean)', color: '#ff0000' }
];

const VARIABLE_CONFIG = {
    temperature_2m:               { name: 'T2m',           unit: '°C',  roundStep: 5  },
    temperature_925hPa:           { name: 'T925',          unit: '°C',  roundStep: 5  },
    temperature_850hPa:           { name: 'T850',          unit: '°C',  roundStep: 5  },
    geopotential_height_500hPa:   { name: 'Z500',          unit: 'm',   roundStep: 50 },
    pressure_msl:                 { name: 'MSLP',          unit: 'hPa', roundStep: 5  },
    precipitation:                { name: 'Precipitation', unit: 'mm',  roundStep: 1  }
};


/* =========================================================
   UI
========================================================= */

function setStatus(text) {
    document.getElementById('statusText').textContent = text;
}

function showError(text) {
    const el = document.getElementById('errorMessage');
    el.textContent = text;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('errorMessage').style.display = 'none';
}

function showWarning(text) {
    const el = document.getElementById('warningMessage');
    el.textContent = text;
    el.style.display = 'block';
}

function hideWarning() {
    document.getElementById('warningMessage').style.display = 'none';
}

function showSuccess(text) {
    const el = document.getElementById('successMessage');
    el.textContent = text;
    el.style.display = 'block';
}

function hideSuccess() {
    document.getElementById('successMessage').style.display = 'none';
}

function debug(text) {
    const el = document.getElementById('debugBox');
    el.textContent = text;
    el.style.display = 'block';
}


/* =========================================================
   URL BUILDING
========================================================= */

function buildUrl(lat, lon, variable, modelIds) {

    const params = new URLSearchParams();

    params.set('latitude', lat);
    params.set('longitude', lon);
    params.set('hourly', variable);
    params.set('models', modelIds.join(','));
    params.set('timezone', 'UTC');

    return `${BASE_URL}?${params.toString()}`;

}


/* =========================================================
   FETCH: COMBINED (single request, all models)
========================================================= */

async function fetchCombined(lat, lon, variable, logs) {

    const modelIds = MODELS.map(m => m.id);
    const url = buildUrl(lat, lon, variable, modelIds);

    logs.push(`[combined] GET ${url}`);

    const response = await fetch(url, { method: 'GET', cache: 'no-store' });
    const json = await response.json().catch(() => null);

    if (!response.ok || !json || json.error) {
        const reason = json?.reason || `HTTP ${response.status} ${response.statusText}`;
        throw new Error(`Combined request failed: ${reason}`);
    }

    const times = json.hourly?.time;

    if (!Array.isArray(times)) {
        throw new Error('Combined request: missing hourly.time in response');
    }

    const results = [];

    for (const model of MODELS) {

        const key = `${variable}_${model.id}`;
        const values = json.hourly[key];

        if (Array.isArray(values) && values.some(v => v !== null && v !== undefined)) {
            results.push({ ...model, times, values });
            logs.push(`[combined] ${model.label}: OK — ${values.length} points`);
        } else {
            logs.push(`[combined] ${model.label}: no usable data (key "${key}")`);
        }

    }

    if (!results.length) {
        throw new Error('Combined request returned no usable data for any model');
    }

    return results;

}


/* =========================================================
   FETCH: PER-MODEL FALLBACK
========================================================= */

async function fetchIndividual(lat, lon, variable, logs) {

    const results = [];

    for (const model of MODELS) {

        const url = buildUrl(lat, lon, variable, [model.id]);

        logs.push(`[individual] GET ${url}`);

        try {

            const response = await fetch(url, { method: 'GET', cache: 'no-store' });
            const json = await response.json().catch(() => null);

            if (!response.ok || !json || json.error) {
                const reason = json?.reason || `HTTP ${response.status} ${response.statusText}`;
                throw new Error(reason);
            }

            const times = json.hourly?.time;
            const values = json.hourly?.[variable];

            if (!Array.isArray(times) || !Array.isArray(values)) {
                throw new Error('Missing hourly time/value arrays');
            }

            if (!values.some(v => v !== null && v !== undefined)) {
                throw new Error('All values null for this model/variable combination');
            }

            results.push({ ...model, times, values });

            logs.push(`[individual] ${model.label}: OK — ${values.length} points`);

        } catch (error) {

            logs.push(`[individual] ${model.label}: FAILED — ${error.message}`);

        }

        await new Promise(resolve => setTimeout(resolve, 150));

    }

    return results;

}


/* =========================================================
   MERGE MULTIPLE MODEL SERIES INTO ONE TIMELINE
========================================================= */

function mergeSeries(seriesList) {

    const dateSet = new Set();

    for (const series of seriesList) {
        for (const t of series.times) {
            dateSet.add(t);
        }
    }

    const dates = Array.from(dateSet).sort();

    const merged = {};

    for (const date of dates) {
        merged[date] = {};
    }

    for (const series of seriesList) {

        const lookup = new Map();

        series.times.forEach((t, i) => {
            lookup.set(t, series.values[i]);
        });

        for (const date of dates) {

            const value = lookup.has(date) ? lookup.get(date) : null;

            merged[date][series.id] = (value === null || value === undefined)
                ? null
                : Number(value);

        }

    }

    return { dates, merged };

}


/* =========================================================
   MAIN
========================================================= */

async function fetchData() {

    const latRaw = document.getElementById('latInput').value.trim();
    const lonRaw = document.getElementById('lonInput').value.trim();

    const lat = Number(latRaw);
    const lon = Number(lonRaw);

    const variable = document.getElementById('variableSelect').value;
    const config = VARIABLE_CONFIG[variable];

    const button = document.getElementById('fetchBtn');
    const loading = document.getElementById('chartLoading');

    if (latRaw === '' || !Number.isFinite(lat) || lat < -90 || lat > 90) {
        showError('Invalid latitude.');
        return;
    }

    if (lonRaw === '' || !Number.isFinite(lon) || lon < -180 || lon > 180) {
        showError('Invalid longitude.');
        return;
    }

    button.disabled = true;
    loading.classList.add('active');

    hideError();
    hideWarning();
    hideSuccess();

    debug('');

    const logs = [];

    try {

        setStatus('Fetching combined request (all models)...');

        let results;

        try {

            results = await fetchCombined(lat, lon, variable, logs);

        } catch (combinedError) {

            logs.push(`Combined attempt failed: ${combinedError.message}`);
            logs.push('Falling back to individual per-model requests...');

            setStatus('Combined request failed — retrying per model...');

            results = await fetchIndividual(lat, lon, variable, logs);

        }

        debug(logs.join('\n'));

        if (!results.length) {
            throw new Error('No model returned usable data for this variable/location.');
        }

        const { dates, merged } = mergeSeries(results);

        updateChart(dates, merged, results, config, lat, lon);

        const successfulModels = results.map(r => r.label).join(', ');

        if (results.length === MODELS.length) {
            showSuccess(`${results.length}/${MODELS.length} models loaded — ${dates.length} timestamps (${successfulModels})`);
        } else {
            showWarning(`Only ${results.length}/${MODELS.length} models loaded — ${dates.length} timestamps (${successfulModels})`);
        }

        setStatus(`${dates.length} forecast timestamps`);

    } catch (error) {

        console.error(error);
        debug(logs.join('\n'));
        showError(error.message);
        setStatus('Failed');

    } finally {

        button.disabled = false;
        loading.classList.remove('active');

    }

}


/* =========================================================
   CHART
========================================================= */

function formatLabel(isoTime) {

    // isoTime looks like "2026-09-08T00:00"
    const [datePart, timePart] = isoTime.split('T');
    const [, month, day] = datePart.split('-');
    const hour = timePart.split(':')[0];

    return `${day}.${month} ${hour}z`;

}

function updateChart(dates, merged, results, config, lat, lon) {

    if (!dates.length) return;

    let allValues = [];

    for (const series of results) {
        for (const date of dates) {
            const value = merged[date][series.id];
            if (value !== null && Number.isFinite(value)) {
                allValues.push(value);
            }
        }
    }

    if (!allValues.length) return;

    const step = config.roundStep;
    const minValue = Math.min(...allValues);
    const maxValue = Math.max(...allValues);

    let yMin = Math.floor(minValue / step) * step;
    let yMax = Math.ceil(maxValue / step) * step;

    if (yMin === yMax) { yMin -= step; yMax += step; }

    if (config.name === 'Precipitation' && yMin > 0) yMin = 0;

    const labels = dates.map(formatLabel);

    const datasets = results.map(series => ({
        label: series.label,
        data: dates.map(date => merged[date][series.id]),
        borderColor: series.color,
        backgroundColor: series.color,
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 4,
        tension: 0,
        spanGaps: true,
        fill: false
    }));

    if (chart) {
        chart.destroy();
        chart = null;
    }

    chart = new Chart(document.getElementById('forecastChart').getContext('2d'), {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                    labels: { color: '#cbd5e1', font: { family: 'Inter', size: 12 } }
                },
                title: {
                    display: true,
                    text: `${config.name} Forecast — ${lat}°N, ${lon}°E`,
                    color: '#f1f5f9',
                    font: { family: 'Inter', size: 18, weight: '600' }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            if (context.parsed.y === null) {
                                return context.dataset.label + ': no data';
                            }
                            return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + ' ' + config.unit;
                        }
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: '#cbd5e1',
                        autoSkip: false,
                        maxRotation: 0,
                        callback: function(value, index) {
                            const label = labels[index];
                            if (label?.endsWith('00z')) return label.split(' ')[0];
                            return '';
                        }
                    },
                    grid: { color: 'rgba(148,163,184,.15)' }
                },
                y: {
                    min: yMin,
                    max: yMax,
                    ticks: { color: '#cbd5e1' },
                    title: { display: true, text: `${config.name} (${config.unit})`, color: '#cbd5e1' },
                    grid: { color: 'rgba(148,163,184,.10)' }
                }
            }
        }
    });

}


/* =========================================================
   INITIAL CHART
========================================================= */

document.addEventListener('DOMContentLoaded', function() {

    chart = new Chart(document.getElementById('forecastChart').getContext('2d'), {
        type: 'line',
        data: {
            labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4'],
            datasets: [{
                label: 'Click Update',
                data: [null, null, null, null],
                borderColor: '#475569',
                borderWidth: 2,
                tension: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                title: { display: true, text: 'Click "Update" to load Open-Meteo forecast data', color: '#cbd5e1' }
            },
            scales: {
                x: { ticks: { color: '#cbd5e1' } },
                y: { ticks: { color: '#cbd5e1' } }
            }
        }
    });

});

</script>

</body>
</html>
